name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Release build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libbpf-dev \
            libcap2-bin \
            libelf-dev \
            pkg-config \
            zlib1g-dev

      - name: Configure
        run: >-
          cmake -B build-ci -S .
          -DCMAKE_BUILD_TYPE=Release
          -DQAFF_BUILD_QUICHE_EXAMPLES=OFF
          -DCMAKE_C_FLAGS=-Werror

      - name: Build
        run: cmake --build build-ci --parallel 2

      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

      - name: Verify library-only configuration
        run: >-
          cmake -B build-library -S .
          -DBUILD_TESTING=OFF
          -DQAFF_BUILD_BPF=OFF
          -DQAFF_BUILD_DAEMON=OFF
          -DQAFF_BUILD_TOOLS=OFF
          -DQAFF_BUILD_EXAMPLES=OFF
          -DQAFF_BUILD_QUICHE_EXAMPLES=OFF
          -DCMAKE_C_FLAGS=-Werror

      - name: Build library-only configuration
        run: cmake --build build-library --parallel 2

  arm64-build-and-test:
    name: Native arm64 release build and tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify native architecture
        run: test "$(uname -m)" = aarch64

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libbpf-dev \
            libcap2-bin \
            libelf-dev \
            pkg-config \
            zlib1g-dev

      - name: Configure and verify BPF architecture
        run: |
          cmake -B build-arm64 -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DQAFF_BUILD_QUICHE_EXAMPLES=OFF \
            -DCMAKE_C_FLAGS=-Werror | tee build-arm64-configure.log
          grep -F "architecture: arm64;" build-arm64-configure.log

      - name: Build
        run: cmake --build build-arm64 --parallel 2

      - name: Test
        run: ctest --test-dir build-arm64 --output-on-failure

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libbpf-dev \
            libelf-dev \
            pkg-config \
            zlib1g-dev

      - name: Configure
        env:
          CC: clang
        run: >-
          cmake -B build-sanitize -S .
          -DCMAKE_BUILD_TYPE=Debug
          -DQAFF_BUILD_BPF=OFF
          -DQAFF_BUILD_QUICHE_EXAMPLES=OFF
          -DQAFF_BUILD_FUZZERS=ON
          -DCMAKE_C_FLAGS="-Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-sanitize --parallel 2

      - name: Run all configured tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
