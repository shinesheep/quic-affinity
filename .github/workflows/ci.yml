name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Release build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libbpf-dev \
            libcap2-bin \
            libelf-dev \
            pkg-config \
            zlib1g-dev

      - name: Configure
        run: >-
          cmake -B build-ci -S .
          -DCMAKE_BUILD_TYPE=Release
          -DQAFF_BUILD_QUICHE_EXAMPLES=OFF
          -DCMAKE_C_FLAGS=-Werror

      - name: Build
        run: cmake --build build-ci --parallel 2

      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

      - name: Verify library-only configuration
        run: >-
          cmake -B build-library -S .
          -DBUILD_TESTING=OFF
          -DQAFF_BUILD_BPF=OFF
          -DQAFF_BUILD_DAEMON=OFF
          -DQAFF_BUILD_TOOLS=OFF
          -DQAFF_BUILD_EXAMPLES=OFF
          -DQAFF_BUILD_QUICHE_EXAMPLES=OFF
          -DCMAKE_C_FLAGS=-Werror

      - name: Build library-only configuration
        run: cmake --build build-library --parallel 2

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libbpf-dev \
            libelf-dev \
            pkg-config \
            zlib1g-dev

      - name: Configure
        env:
          CC: clang
        run: >-
          cmake -B build-sanitize -S .
          -DCMAKE_BUILD_TYPE=Debug
          -DQAFF_BUILD_BPF=OFF
          -DQAFF_BUILD_QUICHE_EXAMPLES=OFF
          -DQAFF_BUILD_FUZZERS=ON
          -DCMAKE_C_FLAGS="-Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-sanitize --parallel 2

      - name: Run all configured tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
